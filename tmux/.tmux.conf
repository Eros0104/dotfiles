set -g mouse on
set-option -g history-limit 5000

# vim-like copy mode
setw -g mode-keys vi

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R


# Pane titles — rendered only in windows that enable pane-border-status
# (dealroom-dev turns it on for its dev window). Falls back to the running
# command when no explicit title is set (tmux defaults pane_title to the host).
set -g pane-border-format " #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} "
